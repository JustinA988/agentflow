[project]
name = "agentflow"
version = "1.0.0"
description = "Turn GitHub issues into PRs with the AI CLI you already pay for. No API keys."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/JustinA988/agentflow"

[project.scripts]
agentflow = "agentflow:main"

[tool.setuptools]
py-modules = ["agentflow", "agentflow_ui"]
